; NeoFly Photo Avatar - settings (relative paths are relative to this folder)

; Your picture. Any jpg/png; it is centre-cropped to NeoFly's portrait shape.
; You can swap the file at any time - NeoFly picks it up next time the avatar is drawn.
Photo=..\Profile\profile.jpg

; Which NeoFly avatar gets replaced.
;   auto = whichever avatar your logged-in pilot currently has (recommended)
;   a number (e.g. 12) = always replace avatar_12
Avatar=auto

; Where to centre the crop, 0.0-1.0 (0.5 = middle). Lower CropX shows more of the left side.
CropX=0.5
CropY=0.5

; NeoFly install folder
NeoflyDir=%LOCALAPPDATA%\Programs\Neofly
