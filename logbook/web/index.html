<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kestrel Air Logbook</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%234cc9f0' d='M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5z'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link href="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.css" rel="stylesheet">
  <link href="css/app.css" rel="stylesheet">
  <script src="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.js"></script>
</head>
<body>
  <div id="map"></div>
  <div id="boot"><div class="boot-plane">✈</div><div>Loading your logbook…</div></div>

  <header id="topbar">
    <div id="pilot"></div>
    <div id="stats"></div>
    <div id="toggles"></div>
  </header>

  <aside id="sidebar">
    <div class="side-head">
      <input id="leg-search" type="search" placeholder="Search airport, city, country, aircraft…" autocomplete="off">
      <button id="panel-toggle" title="Hide / show the journey list">⟨</button>
    </div>
    <div id="fleet"></div>
    <div id="countries"></div>
    <ol id="legs"></ol>
  </aside>

  <aside id="detail"></aside>
  <div id="flash"></div>
  <footer id="timeline"></footer>
  <div id="lightbox" hidden></div>
  <div id="toast" hidden></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
